<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Морський Бій: Координати</title>
    <style>
        :root {
            --bg-color: #f7f6f2;
            --grid-border: #cbd5e1;
            --axis-bg: #e2e8f0;
            --center-bg: #cbd5e1;
            --blue: #3b82f6;
            --green: #84cc16;
            --red: #ef4444;
            --gray: #9ca3af;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            padding: 20px;
            color: #1a202c;
            margin: 0;
        }

        .main-container {
            max-width: 1000px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Таби режимів */
        .tabs {
            display: flex;
            gap: 10px;
            background: #fff;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            color: #4a5568;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-btn:hover { background: #e2e8f0; }
        .tab-btn.active { background: var(--blue); color: white; }

        .game-wrapper {
            display: flex;
            gap: 30px;
            background: #fff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        /* Ліва частина: Сітка */
        .board-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(11, 45px);
            grid-template-rows: repeat(11, 45px);
            border: 2px solid var(--grid-border);
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 15px;
        }

        .cell {
            border: 1px solid #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: background-color 0.2s;
            position: relative;
        }

        .cell:hover { background-color: #e0f2fe !important; }

        /* Осі координат */
        .cell.axis-x { background-color: var(--axis-bg); }
        .cell.axis-y { background-color: var(--axis-bg); }
        .cell.center { background-color: var(--center-bg); }

        /* Маркери та цифри осей */
        .axis-label-x { font-size: 12px; font-weight: bold; color: #64748b; position: absolute; bottom: 2px; right: 4px; pointer-events: none; }
        .axis-label-y { font-size: 12px; font-weight: bold; color: #64748b; position: absolute; top: 2px; left: 4px; pointer-events: none; }
        .axis-number { font-size: 10px; color: #64748b; position: absolute; bottom: 2px; left: 4px; pointer-events: none; }

        /* Права частина: Керування */
        .control-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .stats {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 10px;
            flex: 1;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .stat-box span { display: block; font-size: 14px; color: #4a5568; margin-bottom: 5px; }
        .stat-box strong { font-size: 28px; color: #2d3748; }

        .panel {
            background: #f8fafc;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
        }

        .text-blue { color: var(--blue); font-weight: bold; }
        
        .feedback { 
            min-height: 48px; 
            margin-top: 15px; 
            font-weight: 600; 
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.4;
        }
        .feedback.success { background-color: #dcfce7; color: #166534; }
        .feedback.error { background-color: #fee2e2; color: #991b1b; }
        .feedback.neutral { background-color: transparent; color: #4a5568; border: 1px dashed #cbd5e1;}

        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 15px;
        }

        .btn-primary { background-color: var(--blue); color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        .btn-danger { background-color: var(--red); color: white; }
        .btn-danger:hover { background-color: #dc2626; }

        /* Елементи керування для різних режимів */
        .mode-controls { display: none; }
        .mode-controls.active { display: block; }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
        }
        .input-group input {
            width: 60px;
            padding: 8px;
            font-size: 18px;
            text-align: center;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
        }

        .settings-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
            font-size: 14px;
            color: #4a5568;
        }
        .settings-row input {
            width: 50px;
            padding: 5px;
            text-align: center;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        /* Правила гри */
        .rules-container {
            background: #fffbeb;
            border: 1px solid #fde68a;
            padding: 15px;
            border-radius: 10px;
            margin-top: auto;
        }
        .rules-container h4 { margin: 0 0 10px 0; color: #92400e; }
        .rules-container ul { margin: 0; padding-left: 20px; color: #92400e; font-size: 14px; line-height: 1.5; }
        
        /* Анімації */
        @keyframes pop { 0% { transform: scale(0.8); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .pop-anim { animation: pop 0.3s ease-out forwards; }

        /* АДАПТАЦІЯ ДЛЯ МОБІЛЬНИХ ТА ПЛАНШЕТІВ */
@media (max-width: 768px) {
    .main-container { padding: 0; }
    .game-wrapper {
        flex-direction: column; /* Ставимо панель під сіткою */
        padding: 15px;
        gap: 15px;
    }
    .grid-container {
        /* Зменшуємо розмір клітинок, щоб вони влізли в екран телефону */
        grid-template-columns: repeat(11, min(8vw, 35px));
        grid-template-rows: repeat(11, min(8vw, 35px));
    }
    .cell { font-size: 18px; }
    .tabs { flex-wrap: wrap; }
    .tab-btn { font-size: 14px; padding: 8px; }
    #m1-target, #m3-found { font-size: 28px !important; }
    .stat-box strong { font-size: 22px; }
}
    </style>
</head>
<body>

<div class="main-container">
    <div class="tabs">
        <button class="tab-btn active" onclick="setMode(1)" id="tab-1">Режим 1: Переміщення</button>
        <button class="tab-btn" onclick="setMode(2)" id="tab-2">Режим 2: Стрільба</button>
        <button class="tab-btn" onclick="setMode(3)" id="tab-3">Режим 3: Пошук</button>
    </div>

    <div class="game-wrapper">
        <div class="board-section">
            <h3 style="margin: 0 0 15px 0; color: #2d3748;">Координатна площина</h3>
            <div class="grid-container" id="grid"></div>
        </div>

        <div class="control-section">
            <div class="stats">
                <div class="stat-box">
                    <span>Правильно</span>
                    <strong id="score-correct" style="color: var(--green);">0</strong>
                </div>
                <div class="stat-box">
                    <span>Помилки</span>
                    <strong id="score-wrong" style="color: var(--red);">0</strong>
                </div>
            </div>

            <div class="panel">
                <h4 id="mode-title" style="margin-top: 0; color: #4a5568;">РЕЖИМ 1 — ПЕРЕМІЩЕННЯ</h4>
                <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">

                <div id="controls-1" class="mode-controls active">
                    <p style="font-size: 18px; text-align: center;">Клікни на точку:</p>
                    <div style="font-size: 36px; text-align: center;" class="text-blue" id="m1-target">(0, 0)</div>
                </div>

                <div id="controls-2" class="mode-controls">
                    <p style="font-size: 16px; text-align: center;">Введи координати цілі 🎯:</p>
                    <div class="input-group">
                        <label>X: <input type="number" id="m2-x" min="-5" max="5"></label>
                        <label>Y: <input type="number" id="m2-y" min="-5" max="5"></label>
                    </div>
                    <button class="action-btn btn-danger" onclick="fireMode2()" id="btn-fire">Вогонь! 💥</button>
                </div>

                <div id="controls-3" class="mode-controls">
                    <p style="font-size: 18px; text-align: center;">Кораблі сховані в тумані!</p>
                    
                    <div class="settings-row">
                        <label for="m3-ship-count">Сховати кораблів (4-10):</label>
                        <input type="number" id="m3-ship-count" min="4" max="10" value="4" onchange="initRound()">
                    </div>

                    <div style="font-size: 24px; text-align: center; margin-top: 15px;">
                        Знайдено: <strong class="text-blue" id="m3-found">0</strong> / <span id="m3-total">4</span>
                    </div>
                </div>
                
                <div id="feedback-msg" class="feedback neutral">Починаємо гру!</div>
                <button id="btn-next" class="action-btn btn-primary" style="display:none;" onclick="initRound()">Наступний раунд</button>
            </div>

            <div class="rules-container">
                <h4>📜 Правила:</h4>
                <ul id="rules-text">
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
    const gridEl = document.getElementById('grid');
    const feedbackMsg = document.getElementById('feedback-msg');
    const btnNext = document.getElementById('btn-next');
    
    let state = {
        mode: 1,
        correct: 0,
        wrong: 0,
        isRoundActive: true,
        m1_ship: {x: 0, y: 0},
        m1_target: {x: 0, y: 0},
        m2_ships: [],
        m2_targetIndex: 0,
        m3_hiddenShips: [],
        m3_shots: [],
        m3_foundCount: 0,
        m3_totalShips: 4
    };

    function randomCoord() { return Math.floor(Math.random() * 11) - 5; }
    function randomPos() { return { x: randomCoord(), y: randomCoord() }; }
    function isSamePos(p1, p2) { return p1.x === p2.x && p1.y === p2.y; }

    function generateUniqueShips(count) {
        let ships = [];
        while(ships.length < count) {
            let pos = randomPos();
            if (!ships.some(s => isSamePos(s, pos))) ships.push(pos);
        }
        return ships;
    }

    function setMode(newMode) {
        state.mode = newMode;
        state.correct = 0;
        state.wrong = 0;
        updateScoreUI();

        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.getElementById(`tab-${newMode}`).classList.add('active');

        document.querySelectorAll('.mode-controls').forEach(el => el.classList.remove('active'));
        document.getElementById(`controls-${newMode}`).classList.add('active');

        const titleEl = document.getElementById('mode-title');
        const rulesEl = document.getElementById('rules-text');
        
        if (newMode === 1) {
            titleEl.innerText = 'РЕЖИМ 1 — ПЕРЕМІЩЕННЯ';
            rulesEl.innerHTML = '<li>Система показує координати точки.</li><li>Знайди її на площині та <b>клікни мишкою</b>, щоб перемістити туди корабель.</li>';
        } else if (newMode === 2) {
            titleEl.innerText = 'РЕЖИМ 2 — СТРІЛЬБА';
            rulesEl.innerHTML = '<li>На полі 4 кораблі. Один позначено як ціль 🎯.</li><li>Визнач його координати по осях X та Y.</li><li>Введи числа у поля та натисни "Вогонь!".</li>';
        } else if (newMode === 3) {
            titleEl.innerText = 'РЕЖИМ 3 — ПОШУК';
            rulesEl.innerHTML = '<li>Кораблі невидимі! Клікай по клітинках, щоб їх знайти.</li><li>Якщо промахнешся, гра підкаже відстань до найближчого корабля (Гаряче/Тепло/Холодно).</li>';
        }

        initRound();
    }

    function initRound() {
        state.isRoundActive = true;
        btnNext.style.display = 'none';
        setFeedback('Починаємо!', 'neutral');

        if (state.mode === 1) {
            state.m1_ship = state.m1_target;
            do { state.m1_target = randomPos(); } 
            while (isSamePos(state.m1_ship, state.m1_target));
            
            document.getElementById('m1-target').innerText = `(${state.m1_target.x}, ${state.m1_target.y})`;
            setFeedback('Клікни на вказану ціль на полі!', 'neutral');
        } 
        else if (state.mode === 2) {
            state.m2_ships = generateUniqueShips(4);
            state.m2_targetIndex = Math.floor(Math.random() * 4);
            
            document.getElementById('m2-x').value = '';
            document.getElementById('m2-y').value = '';
            document.getElementById('m2-x').focus();
            document.getElementById('btn-fire').disabled = false;
        }
        else if (state.mode === 3) {
            let countInput = parseInt(document.getElementById('m3-ship-count').value);
            if (isNaN(countInput) || countInput < 4) countInput = 4;
            if (countInput > 10) countInput = 10;
            
            state.m3_totalShips = countInput;
            document.getElementById('m3-ship-count').value = countInput;
            document.getElementById('m3-total').innerText = countInput;
            
            // Зберігаємо кораблі і додаємо їм властивість found
            state.m3_hiddenShips = generateUniqueShips(countInput).map(pos => ({...pos, found: false}));
            state.m3_shots = [];
            state.m3_foundCount = 0;
            document.getElementById('m3-found').innerText = '0';
            setFeedback('Клікай по клітинках, щоб знайти кораблі!', 'neutral');
        }

        renderGrid();
    }

    // Обчислення відстані "Гаряче/Холодно" (Манхеттенська відстань)
    function getHint(x, y) {
        let nearestDist = Infinity;
        
        state.m3_hiddenShips.forEach(ship => {
            if (!ship.found) {
                // Різниця по X + Різниця по Y
                let dist = Math.abs(ship.x - x) + Math.abs(ship.y - y);
                if (dist < nearestDist) nearestDist = dist;
            }
        });

        if (nearestDist === 1) return "🔥 Дуже гаряче!";
        if (nearestDist <= 3) return "☀️ Тепло!";
        return "❄️ Холодно!";
    }

    function handleCellClick(x, y) {
        if (!state.isRoundActive) return;

        if (state.mode === 1) {
            if (x === state.m1_target.x && y === state.m1_target.y) {
                addScore(true);
                setFeedback('Чудово! Точне влучання! 🎯', 'success');
                state.m1_ship = {x, y};
                state.isRoundActive = false;
                btnNext.style.display = 'block';
            } else {
                addScore(false);
                setFeedback(`Упс! Ти клікнув на (${x}, ${y}). Шукай (${state.m1_target.x}, ${state.m1_target.y})!`, 'error');
            }
            renderGrid();
        } 
        else if (state.mode === 3) {
            if (state.m3_shots.some(s => isSamePos(s, {x, y}))) return;

            let hitShip = state.m3_hiddenShips.find(s => isSamePos(s, {x, y}));
            let isHit = !!hitShip;
            state.m3_shots.push({x, y, isHit});

            if (isHit) {
                hitShip.found = true;
                addScore(true);
                state.m3_foundCount++;
                document.getElementById('m3-found').innerText = state.m3_foundCount;
                
                if (state.m3_foundCount === state.m3_totalShips) {
                    setFeedback('🎉 Усі кораблі знайдено! Чудова робота!', 'success');
                    state.isRoundActive = false;
                    btnNext.style.display = 'block';
                } else {
                    setFeedback(`💥 Влучання по (${x}, ${y})! Шукай наступний.`, 'success');
                }
            } else {
                addScore(false);
                let hintText = getHint(x, y);
                setFeedback(`❌ Промах по (${x}, ${y}).<br><b>Підказка:</b> ${hintText}`, 'error');
            }
            renderGrid();
        }
    }

    function fireMode2() {
        if (!state.isRoundActive) return;

        let inputX = parseInt(document.getElementById('m2-x').value);
        let inputY = parseInt(document.getElementById('m2-y').value);

        if (isNaN(inputX) || isNaN(inputY)) {
            setFeedback('Введи обидва числа!', 'error');
            return;
        }

        let target = state.m2_ships[state.m2_targetIndex];

        if (inputX === target.x && inputY === target.y) {
            addScore(true);
            setFeedback('💥 Точно в ціль! Корабель знищено!', 'success');
            state.isRoundActive = false;
            document.getElementById('btn-fire').disabled = true;
            btnNext.style.display = 'block';
            target.destroyed = true; 
        } else {
            addScore(false);
            setFeedback(`❌ Промах! Ти вистрілив по (${inputX}, ${inputY}). Спробуй ще!`, 'error');
        }
        renderGrid();
    }

    function renderGrid() {
        gridEl.innerHTML = '';
        for (let row = 0; row < 11; row++) {
            for (let col = 0; col < 11; col++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                
                const x = col - 5;
                const y = 5 - row;

                if (x === 0 && y === 0) {
                    cell.classList.add('center');
                    cell.innerHTML += '<span class="axis-number">0</span>';
                } else if (y === 0) {
                    cell.classList.add('axis-x');
                    cell.innerHTML += `<span class="axis-number">${x}</span>`;
                    if (x === 5) cell.innerHTML += '<span class="axis-label-x">X</span>';
                } else if (x === 0) {
                    cell.classList.add('axis-y');
                    cell.innerHTML += `<span class="axis-number">${y}</span>`;
                    if (y === 5) cell.innerHTML += '<span class="axis-label-y">Y</span>';
                }

                if (state.mode === 1) {
                    if (x === state.m1_ship.x && y === state.m1_ship.y) cell.innerHTML += '🚢';
                }
                
                if (state.mode === 2) {
                    let shipIndex = state.m2_ships.findIndex(s => s.x === x && s.y === y);
                    if (shipIndex !== -1) {
                        let ship = state.m2_ships[shipIndex];
                        if (ship.destroyed) {
                            cell.innerHTML += '<span class="pop-anim">💥</span>';
                        } else {
                            cell.innerHTML += '🚢';
                            if (shipIndex === state.m2_targetIndex) {
                                cell.innerHTML += '<span style="position:absolute; font-size: 30px;">🎯</span>';
                            }
                        }
                    }
                }

                if (state.mode === 3) {
                    let shot = state.m3_shots.find(s => s.x === x && s.y === y);
                    if (shot) {
                        cell.innerHTML += shot.isHit ? '<span class="pop-anim">🚢💥</span>' : '<span style="opacity: 0.3;">❌</span>';
                    }
                }

                if (state.mode === 1 || state.mode === 3) {
                    cell.addEventListener('click', () => handleCellClick(x, y));
                }

                gridEl.appendChild(cell);
            }
        }
    }

    function addScore(isCorrect) {
        if (isCorrect) state.correct++; else state.wrong++;
        updateScoreUI();
    }

    function updateScoreUI() {
        document.getElementById('score-correct').innerText = state.correct;
        document.getElementById('score-wrong').innerText = state.wrong;
    }

    function setFeedback(msg, type) {
        feedbackMsg.innerHTML = msg;
        feedbackMsg.className = `feedback ${type}`;
    }

    setMode(1);
</script>
</body>
</html>
